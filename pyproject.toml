# SPDX-License-Identifier: Apache-2.0
# Packaging metadata for the khipu-sda-core modules (PEP 517 / PEP 621).
#
# The repository is a flat layout of top-level szl_*.py modules, listed
# explicitly below. Wheel metadata owns the runtime dependency contract;
# requirements.txt selects the optional features used by the repository CI.
# No tag or release exists, so the version is a placeholder.

[build-system]
# 77 is the first setuptools that accepts an SPDX string for project.license.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "khipu-sda-core"
version = "0.0.0"
description = "Clean-room anomaly/SDA core engine (szl_mosaic)."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "sgp4>=2.27",
]

[project.optional-dependencies]
# The base installation exercises the NumPy PCA and local unsigned-receipt paths.
torch = ["torch>=2.14.1"]
receipt = ["szl-receipt @ git+https://github.com/szl-holdings/szl-receipt.git@v0.2.0"]
test = ["pytest>=9.1.1"]

[tool.setuptools]
py-modules = [
    "szl_confidence",
    "szl_mosaic_core",
    "szl_mosaic_validate",
    "szl_sda_envelope",
    "szl_sda_orbit",
    "szl_sda_spine",
    "szl_track_fusion",
    "szl_witness",
]
